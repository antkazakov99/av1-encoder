[package]
name = "av1-gui"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
rfd = "0.18.0"
serde_json = "1.0.154"
serde = { version = "1", features = ["derive"] }
regex = "1.13"
md5 = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
